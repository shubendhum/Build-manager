version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: buildmanager-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: buildmanager

  # Virus scanning for files that arrive from outside — tradie email
  # attachments and portal uploads. Local, so nothing is sent to a third party.
  # Note: clamd holds the signature database in memory (~1.5 GB) and takes a
  # couple of minutes to become ready on first start.
  clamav:
    image: clamav/clamav:latest
    container_name: buildmanager-clamav
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buildmanager-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3080:8000"
    env_file:
      - ./backend/.env
    volumes:
      - uploads:/app/backend/uploads
    depends_on:
      - mongo
      - clamav
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: buildmanager-frontend
    restart: unless-stopped
    ports:
      - "5000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  uploads:
