version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: buildmanager-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: buildmanager

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buildmanager-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3080:8000"
    env_file:
      - ./backend/.env
    volumes:
      - uploads:/app/backend/uploads
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: buildmanager-frontend
    restart: unless-stopped
    ports:
      - "5000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  uploads:
